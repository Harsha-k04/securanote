<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecuraNote - Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .reset-card {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-primary {
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .password-strength {
      height: 5px;
      transition: all 0.3s ease;
    }
    .checkbox-toggle {
      position: relative;
      display: inline-block;
      width: 3rem;
      height: 1.5rem;
    }
    .checkbox-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 1.5rem;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 1.1rem;
      width: 1.1rem;
      left: 0.2rem;
      bottom: 0.2rem;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background-color: #4f46e5;
    }
    input:checked + .toggle-slider:before {
      transform: translateX(1.5rem);
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in-out forwards;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="reset-card bg-white rounded-xl p-8 w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Reset Password</h1>
      <p class="text-gray-600 mt-2">Create a new secure password for your account</p>
    </div>

    <!-- Form -->
    <form id="resetForm" method="POST" class="space-y-6">
      <!-- New Password -->
      <div class="space-y-2">
        <label for="new_password" class="block text-sm font-medium text-gray-700">New Password</label>
        <div class="relative">
          <input type="password" name="new_password" id="new_password"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-4 focus:ring-indigo-300"
            placeholder="Enter new password" required />
        </div>

        <!-- Show Password Toggle -->
        <div class="flex items-center justify-between mt-2">
          <span class="text-sm text-gray-600">Show Password</span>
          <label class="checkbox-toggle">
            <input type="checkbox" id="showPassword" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Strength Bar -->
        <div class="mt-3">
          <div class="flex justify-between mb-1">
            <span class="text-xs text-gray-600">Password Strength</span>
            <span id="strengthText" class="text-xs font-medium">None</span>
          </div>
          <div class="w-full bg-gray-200 rounded-full h-1.5">
            <div id="strengthBar" class="password-strength bg-gray-400 rounded-full h-1.5" style="width: 0%"></div>
          </div>
        </div>

        <!-- Requirements -->
        <div id="passwordRequirements" class="mt-3 text-xs text-gray-600 space-y-1">
          <p id="req1" class="flex items-center">✔ At least 8 characters</p>
          <p id="req2" class="flex items-center">✔ Contains uppercase letter</p>
          <p id="req3" class="flex items-center">✔ Contains number</p>
          <p id="req4" class="flex items-center">✔ Contains special character</p>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="space-y-2">
        <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input type="password" id="confirm_password"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-4 focus:ring-indigo-300"
          placeholder="Confirm your password" required />
        <p id="passwordMatchError" class="text-red-500 text-sm hidden">Passwords do not match</p>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="resetButton"
        class="btn-primary w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
        Reset Password
      </button>

      <!-- Back -->
      <div class="text-center">
        <button type="button" id="backButton"
          class="text-indigo-600 font-medium hover:underline focus:outline-none">Back to Login</button>
      </div>
    </form>

    <!-- Success Message -->
    <div id="successMessage" class="hidden text-center space-y-4 py-6 fade-in">
      <div class="flex justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h2 class="text-xl font-bold text-gray-800">Password Reset Successful</h2>
      <p class="text-gray-600">Your password has been updated successfully.</p>
      <button id="loginButton"
        class="btn-primary w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 mt-4">
        Go to Login
      </button>
    </div>

    <!-- Notification -->
    <div id="notification"
      class="fixed top-4 right-4 bg-white rounded-lg shadow-lg p-4 transform translate-x-full transition-transform duration-300 max-w-xs">
      <div class="flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-500 mr-2" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p id="notificationText" class="text-gray-700"></p>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    const passwordInput = document.getElementById('new_password');
    const confirmPasswordInput = document.getElementById('confirm_password');
    const showPasswordToggle = document.getElementById('showPassword');
    const passwordMatchError = document.getElementById('passwordMatchError');
    const resetForm = document.getElementById('resetForm');
    const resetButton = document.getElementById('resetButton');
    const backButton = document.getElementById('backButton');
    const loginButton = document.getElementById('loginButton');
    const successMessage = document.getElementById('successMessage');
    const notification = document.getElementById('notification');
    const notificationText = document.getElementById('notificationText');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    const req1 = document.getElementById('req1');
    const req2 = document.getElementById('req2');
    const req3 = document.getElementById('req3');
    const req4 = document.getElementById('req4');

    // Show/Hide Password
    showPasswordToggle.addEventListener('change', () => {
      const type = showPasswordToggle.checked ? 'text' : 'password';
      passwordInput.type = type;
      confirmPasswordInput.type = type;
    });

    // Check strength
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      let strength = 0;

      const hasLength = password.length >= 8;
      const hasUpper = /[A-Z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const hasSpecial = /[^A-Za-z0-9]/.test(password);

      updateRequirement(req1, hasLength);
      updateRequirement(req2, hasUpper);
      updateRequirement(req3, hasNumber);
      updateRequirement(req4, hasSpecial);

      strength += hasLength ? 25 : 0;
      strength += hasUpper ? 25 : 0;
      strength += hasNumber ? 25 : 0;
      strength += hasSpecial ? 25 : 0;

      let color = 'bg-gray-400', label = 'None';
      if (strength <= 25 && strength > 0) { color = 'bg-red-500'; label = 'Weak'; }
      else if (strength <= 50) { color = 'bg-orange-500'; label = 'Fair'; }
      else if (strength <= 75) { color = 'bg-yellow-500'; label = 'Good'; }
      else if (strength === 100) { color = 'bg-green-500'; label = 'Strong'; }

      strengthBar.className = `password-strength ${color} rounded-full h-1.5`;
      strengthBar.style.width = `${strength}%`;
      strengthText.textContent = label;
      strengthText.className = `text-xs font-medium ${getTextColor(color)}`;

      checkPasswordsMatch();
    });

    confirmPasswordInput.addEventListener('input', checkPasswordsMatch);

    function updateRequirement(el, met) {
      el.classList.toggle('text-green-500', met);
    }

    function getTextColor(bg) {
      return {
        'bg-red-500': 'text-red-500',
        'bg-orange-500': 'text-orange-500',
        'bg-yellow-500': 'text-yellow-500',
        'bg-green-500': 'text-green-500',
      }[bg] || 'text-gray-600';
    }

    function checkPasswordsMatch() {
      const mismatch = passwordInput.value !== confirmPasswordInput.value;
      passwordMatchError.classList.toggle('hidden', !mismatch);
      resetButton.disabled = mismatch;
      resetButton.classList.toggle('opacity-50', mismatch);
      resetButton.classList.toggle('cursor-not-allowed', mismatch);
    }

    resetForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (passwordInput.value !== confirmPasswordInput.value) return;

      resetForm.classList.add('hidden');
      successMessage.classList.remove('hidden');
      showNotification("Password reset successful!");
    });

    backButton.onclick = () => {
      showNotification("Redirecting to login page...");
      setTimeout(() => {
      window.location.href = "/login";
     }, 1500);
    };

    loginButton.onclick = () => {
      showNotification("Redirecting to login page...");
      setTimeout(() => {
      window.location.href = "/login";
      }, 1500);
    };


    function showNotification(msg) {
      notificationText.textContent = msg;
      notification.classList.remove('translate-x-full');
      notification.classList.add('translate-x-0');
      setTimeout(() => {
        notification.classList.remove('translate-x-0');
        notification.classList.add('translate-x-full');
      }, 3000);
    }
  </script>
</body>
</html>
